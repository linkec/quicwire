mode = "server"
listen = ["0.0.0.0:4433-4440"] # 可指定本机 IP，例如 "192.0.2.1:4433-4440"
private_key_file = "server.key"
peer_public_key = "替换为客户端 keygen 输出的完整公钥"
tun_name = "qw0"
tun_address = "10.77.0.1/30"
peer_address = "10.77.0.2"
mtu = 1100
tun_offload = true

# 0 关闭；1–3 为每组校验包发送份数，两端必须一致。客户端开启时 active_sessions >= 2。
fec = 0
