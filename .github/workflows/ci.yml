name: Rust 检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 静态检查与构建
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: 测试
        run: cargo test --locked --all-targets
      - name: 构建 Linux 二进制
        run: cargo build --release --locked
      - name: 真实 TUN 与故障恢复检查
        run: |
          sudo bash scripts/linux-smoke.sh target/release/quicwire
          sudo env QUICWIRE_TEST_MTU=576 bash scripts/linux-smoke.sh target/release/quicwire
          sudo env QUICWIRE_TEST_OFFLOAD=false bash scripts/linux-smoke.sh target/release/quicwire
          sudo env QUICWIRE_TEST_MULTIPATH=true bash scripts/linux-smoke.sh target/release/quicwire
      - name: 四种选路预设与会话生命周期
        run: |
          pids=()
          for policy in balanced low_latency low_loss hybrid; do
            flag=QUICWIRE_TEST_LIFECYCLE=true
            if [[ "$policy" == hybrid ]]; then flag=QUICWIRE_TEST_MULTIPATH=true; fi
            sudo env "$flag" QUICWIRE_TEST_SELECTION_POLICY="$policy" bash scripts/linux-smoke.sh target/release/quicwire > "selection-$policy.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat selection-*.log
          exit "$failed"
      - name: 互斥端点组、故障降级与恢复
        run: sudo env QUICWIRE_TEST_EXCLUSIVE=true QUICWIRE_TEST_SELECTION_POLICY=hybrid bash scripts/linux-smoke.sh target/release/quicwire
      - name: FEC 双向恢复、内容校验与有损网络
        run: |
          sudo env QUICWIRE_TEST_FEC=1 QUICWIRE_TEST_SELECTION_POLICY=hybrid bash scripts/linux-smoke.sh target/release/quicwire
          sudo env QUICWIRE_TEST_FEC=2 QUICWIRE_TEST_SELECTION_POLICY=hybrid bash scripts/linux-smoke.sh target/release/quicwire
      - name: 保存 Linux 测试构建
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quicwire-linux-x86_64
          path: target/release/quicwire
          if-no-files-found: error
          retention-days: 14
