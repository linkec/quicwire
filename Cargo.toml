[package]
name = "quicwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "使用公私钥身份的多路径 QUIC 冗余 IP 隧道"
repository = "https://github.com/linkec/quicwire"
readme = "README.md"

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["socket"] }
tun-rs = { version = "=2.8.11", features = ["async_tokio"] }

[dev-dependencies]
tempfile = "3"
